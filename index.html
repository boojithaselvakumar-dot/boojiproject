<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f3" />
    <meta name="description" content="A calmer way to learn, with your personal AI study companion." />
    <title>EduGenie | Your learning space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="/" aria-label="EduGenie home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>edu<span class="brand-accent">genie</span></span>
      </a>
      <div class="nav-label">LEARN</div>
      <nav class="nav-list">
        <button class="nav-item active" data-view="tutor" aria-current="page">
          <span class="nav-icon" aria-hidden="true">✳</span><span>Tutor</span>
        </button>
        <button class="nav-item" data-view="cards">
          <span class="nav-icon" aria-hidden="true">▤</span><span>Flashcards</span><span class="nav-count">08</span>
        </button>
        <button class="nav-item" data-view="quiz">
          <span class="nav-icon" aria-hidden="true">◉</span><span>Quick quiz</span>
        </button>
      </nav>
      <div class="sidebar-spacer"></div>
      <section class="streak-box" aria-label="Weekly study goal">
        <div class="streak-top"><span class="streak-icon">✦</span><span>WEEKLY GOAL</span></div>
        <strong><span id="goal-count">0</span> of 5 sessions</strong>
        <div class="goal-track"><span id="goal-progress"></span></div>
        <span class="goal-caption">Little by little adds up.</span>
      </section>
      <div class="profile-row">
        <span class="avatar">A</span>
        <span class="profile-name">Alex Morgan<small>Curious learner</small></span>
        <span class="profile-more" aria-hidden="true">···</span>
      </div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <span class="mobile-brand"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>edugenie</span>
        <div class="topbar-note"><span class="online-dot"></span><span id="connection-status">Checking tutor...</span></div>
        <div class="topbar-right"><span class="top-date" id="today-date"></span><span class="avatar avatar-small">A</span></div>
      </header>
      <div id="view" class="view-root" aria-live="polite"></div>
    </main>
  </body>
</html>
